<!DOCTYPE html>
<html lang="ar" dir="rtl"> <!-- جعلنا الافتراضي عربي، والـ React سيقوم بتغييره للانجليزي عند الحاجة -->

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- ========================================== -->
  <!-- 1. تحسين محركات البحث (Google SEO) -->
  <!-- ========================================== -->
  
  <!-- عنوان الصفحة: يجب أن يحتوي على اسم البراند وكلمات مفتاحية -->
  <title>Maison Izzure | دار إيزور للعطور الفاخرة</title>
  
  <!-- الوصف: هذا هو النص الذي سيظهر تحت الرابط في نتائج بحث جوجل -->
  <meta name="description" content="اكتشف عالم إيزور (Maison Izzure). عطور نيش فاخرة تُصنع بشغف وهدوء. دقة في التكوين، وإحساس يكمن في كل نفحة. استكشف عطرنا الأول 'إزهار'." />
  
  <!-- الكلمات المفتاحية: الكلمات التي يكتبها الناس في البحث -->
  <meta name="keywords" content="عطور, عطر فاخر, إيزور, عطر إزهار, عطور نيش, Maison Izzure, Luxury Perfume, Izhar Fragrance, Niche Perfumes" />
  
  <meta name="author" content="Maison Izzure" />
  <!-- السماح لمحركات البحث بفهرسة الموقع -->
  <meta name="robots" content="index, follow" />


  <!-- ========================================== -->
  <!-- 2. بطاقات السوشيال ميديا والواتساب (Open Graph) -->
  <!-- ========================================== -->
  
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Maison Izzure | دار إيزور للعطور الفاخرة" />
  <meta property="og:description" content="عطور نيش فاخرة تُصنع بشغف وهدوء. استكشف مجموعة إيزور واسمح للعطر أن يترك أثره." />
  
  <!-- هذه هي الصورة التي ستظهر عند إرسال رابط الموقع في واتساب أو تويتر -->
  <meta property="og:image" content="/apple-touch-icon.png" /> 
  
  <!-- ضع هنا رابط موقعك المستقبلي عندما تقوم بحجزه -->
  <meta property="og:url" content="https://www.izzure.com" /> 


  <!-- ========================================== -->
  <!-- 3. الأيقونات والخطوط (كما هي في كودك) -->
  <!-- ========================================== -->
  
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Changa:wght@300;400;500;600;700&family=Fraunces:opsz,wght@9..144,300..600&family=Inter:wght@300;400;500;600&family=Jost:wght@300;400;500&family=Markazi+Text:wght@400;500;600;700&family=Tajawal:wght@400;500;700&display=swap"
    rel="stylesheet">

  <style>
    html,
    body {
      height: 100%;
      margin: 0;
    }

    #root {
      height: 100%;
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
